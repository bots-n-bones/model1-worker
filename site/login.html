<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Модель №1</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e9e7e1;background:#101310}
  *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 70% 0,#2f4b36,transparent 40%),#101310}
  main{width:min(100%,420px)}.brand{color:#b8d7a8;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:30px}
  h1{font-size:40px;letter-spacing:-.05em;line-height:1.05;margin:0 0 12px}p{color:#aeb8ae;line-height:1.5;margin:0 0 30px}
  form{background:#1a201a;border:1px solid #394639;border-radius:20px;padding:25px}label{display:block;color:#bdc7ba;font-size:13px;font-weight:650;margin:0 0 8px}
  input{width:100%;height:46px;padding:0 13px;margin:0 0 18px;color:#f2f2ec;background:#111611;border:1px solid #435044;border-radius:11px;font:inherit;outline:none}input:focus{border-color:#a8cf9d;box-shadow:0 0 0 3px #a8cf9d22}
  button{width:100%;border:0;border-radius:11px;background:#bbeca8;color:#152317;padding:14px;font:700 15px inherit;cursor:pointer}button:hover{background:#d1ffbf}.error{color:#f3a8a5;margin:0 0 14px;display:none}
</style></head><body><main><div class="brand">Model / 01</div><h1>Вход в студию</h1><p>Введите логин и пароль, чтобы запустить генерацию на Mac.</p>
<form method="post" action="/login"><div class="error" id="error">Неверный логин или пароль.</div><label for="username">Логин</label><input id="username" name="username" autocomplete="username" required value="studio"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Войти →</button></form></main>
<script>if(new URLSearchParams(location.search).has('error'))document.querySelector('#error').style.display='block';</script></body></html>
