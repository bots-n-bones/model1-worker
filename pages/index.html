<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Модель №1 — студия</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e9e7e1;background:#101310}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% -15%,#2f4b36 0,transparent 35%),#101310}
    main{max-width:1100px;margin:auto;padding:48px 28px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:54px}
    .brand{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#b8d7a8}.status{font-size:13px;color:#a7b1a5;display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;background:#82d5a0;border-radius:50%;box-shadow:0 0 12px #82d5a0}.dot.off{background:#c47b73;box-shadow:0 0 12px #c47b73}
    h1{font-size:clamp(40px,6vw,74px);line-height:1.02;letter-spacing:-.055em;max-width:760px;margin:0 0 18px}.lead{color:#aeb8ae;font-size:17px;max-width:650px;line-height:1.6;margin:0 0 36px}
    .panel{background:#1a201a;border:1px solid #394639;border-radius:22px;padding:24px;box-shadow:0 24px 70px #0004}
    label{display:block;font-size:13px;color:#bdc7ba;margin-bottom:9px;font-weight:650}textarea,select,input{font:inherit;color:#f2f2ec;background:#111611;border:1px solid #435044;border-radius:12px;outline:none}textarea:focus,select:focus,input:focus{border-color:#a8cf9d;box-shadow:0 0 0 3px #a8cf9d22}textarea{width:100%;min-height:145px;padding:17px;resize:vertical;line-height:1.5}textarea::placeholder{color:#778478}
    .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.controls select{width:100%;height:46px;padding:0 12px}
    .bottom{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}.upload{display:inline-flex;align-items:center;gap:10px;padding:11px 15px;border:1px dashed #738274;border-radius:12px;cursor:pointer;color:#d4dfd2;font-size:14px}.upload input{display:none}.refs{color:#a9b7a5;font-size:13px}
    button{border:0;border-radius:12px;background:#bbeca8;color:#152317;font:700 15px inherit;padding:14px 25px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:hover:not(:disabled){background:#d1ffbf}
    h2{font-size:22px;margin:45px 0 18px;letter-spacing:-.03em}.jobs{display:grid;gap:14px}.job{padding:18px;border:1px solid #344235;border-radius:16px;background:#171d18}.jobhead{display:flex;justify-content:space-between;gap:18px;align-items:center}.prompt{margin:0;overflow-wrap:anywhere}.meta{font-size:12px;color:#9faa9d;white-space:nowrap}.pill{display:inline-block;font-size:12px;color:#172218;background:#b9d9ad;padding:5px 9px;border-radius:99px;margin-top:10px}.error{color:#f3a8a5}.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:15px}.images a{display:block}.images img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.empty{color:#8e9c8e;padding:24px;border:1px dashed #3b4a3c;border-radius:14px}
    @media(max-width:650px){main{padding:26px 16px 60px}header{margin-bottom:40px}.controls{grid-template-columns:1fr}.jobhead{display:block}.meta{margin-top:8px}.panel{padding:16px}}
  </style>
</head>
<body>
<main>
  <header><div class="brand">Model / 01</div><div class="status"><span class="dot off" id="dot"></span><span id="worker">Проверяю исполнитель на Mac…</span></div></header>
  <h1>Создавайте изображения в Google Flow.</h1>
  <p class="lead">Очередь и галерея живут на сервере. Генерация идёт на Mac, пока там запущен исполнитель.</p>
  <form id="form" class="panel">
    <label for="prompt">Описание изображения</label>
    <textarea id="prompt" required maxlength="4000" placeholder="Например: рыжий кот на подоконнике в мягком утреннем свете"></textarea>
    <div class="controls">
      <div><label for="aspect">Формат</label><select id="aspect"><option>1:1</option><option>16:9</option><option>4:3</option><option>3:4</option><option>9:16</option></select></div>
      <div><label for="count">Количество</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
      <div><label for="resolution">Разрешение</label><select id="resolution"><option value="1k">1K</option><option value="2k">2K</option></select></div>
    </div>
    <div class="bottom"><div><label class="upload" title="Текущий режим Flow не поддерживает генерацию с референсами">＋ Референсы пока недоступны <input id="files" type="file" accept="image/*" multiple disabled></label><div id="ref-count" class="refs">Текущий режим Flow принимает только текстовые запросы.</div></div><button id="submit" type="submit">Сгенерировать →</button></div>
  </form>
  <h2>Задачи и результаты</h2><div id="jobs" class="jobs"><div class="empty">Пока нет задач.</div></div>
</main>
<script>
const params=new URLSearchParams(location.search);
const API=(params.get('api')||localStorage.getItem('studio_api')||'https://banana.molotilka.site').replace(/\/$/,'');
const auth=sessionStorage.getItem('studio_auth');
if(!auth)location.replace('login.html'+location.search);
const headers=extra=>Object.assign({'Authorization':'Basic '+auth},extra||{});
const form=document.querySelector('#form'), jobs=document.querySelector('#jobs'), submit=document.querySelector('#submit'), files=document.querySelector('#files'), refCount=document.querySelector('#ref-count'), dot=document.querySelector('#dot'), worker=document.querySelector('#worker');
files.onchange=()=>refCount.textContent=files.files.length?`Выбрано файлов: ${files.files.length} (максимум 10)`:'Текущий режим Flow принимает только текстовые запросы.';
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setWorker(online){dot.classList.toggle('off',!online);worker.textContent=online?'Исполнитель на Mac в сети':'Исполнитель на Mac не в сети'}
async function fillImages(root){
  for(const img of root.querySelectorAll('img[data-src]')){
    try{
      const r=await fetch(API+img.dataset.src,{headers:headers()});
      if(!r.ok)continue;
      const url=URL.createObjectURL(await r.blob());
      img.src=url; if(img.parentElement&&img.parentElement.tagName==='A')img.parentElement.href=url;
    }catch(e){}
  }
}
async function refresh(){
  try{
    const r=await fetch(API+'/api/jobs',{headers:headers()});
    if(r.status===401){sessionStorage.removeItem('studio_auth');location.replace('login.html'+location.search);return}
    const data=await r.json();
    setWorker(Boolean(data.worker_online));
    jobs.innerHTML=data.jobs.length?data.jobs.map(j=>`<article class="job"><div class="jobhead"><p class="prompt">${escapeHtml(j.prompt)}</p><span class="meta">${escapeHtml(j.aspect_ratio)} · ${j.count} шт. · ${escapeHtml(j.resolution.toUpperCase())}</span></div><span class="pill">${({queued:'В очереди',processing:'Генерируется',done:'Готово',failed:'Ошибка'}[j.status]||j.status)}</span>${j.error_code?` <span class="error">${escapeHtml(j.error_code)}</span>`:''}${j.urls?.length?`<div class="images">${j.urls.map(u=>`<a href="#" target="_blank" download><img data-src="${u}" alt="Результат генерации"></a>`).join('')}</div>`:''}</article>`).join(''):'<div class="empty">Пока нет задач.</div>';
    await fillImages(jobs);
  }catch(e){setWorker(false);jobs.innerHTML='<div class="empty">Нет связи с сервером студии.</div>'}
}
form.onsubmit=async e=>{
  e.preventDefault();submit.disabled=true;submit.textContent='Добавляю задачу…';
  try{
    const body={prompt:document.querySelector('#prompt').value,aspect_ratio:document.querySelector('#aspect').value,count:Number(document.querySelector('#count').value),resolution:document.querySelector('#resolution').value,image_urls:[]};
    const r=await fetch(API+'/api/jobs',{method:'POST',headers:headers({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===401){sessionStorage.removeItem('studio_auth');location.replace('login.html'+location.search);return}
    if(!r.ok)throw new Error((await r.json()).detail||'Не удалось создать задачу');
    form.reset();await refresh();
  }catch(err){alert(err.message)}
  finally{submit.disabled=false;submit.textContent='Сгенерировать →'}
};
refresh();setInterval(refresh,4000);
</script>
</body>
</html>
